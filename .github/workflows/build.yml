name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.1.0
        with:
          versionSpec: '6.x'

      - name: GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.1.0
        with:
          configFilePath: GitVersion.yml

      - name: Build
        run: dotnet build src/SuperClean.csproj -c Release -p:Version=${{ steps.gitversion.outputs.FullSemVer }}

      - name: Pack dotnet tool
        run: dotnet pack src/SuperClean.csproj -c Release -o nupkg -p:Version=${{ steps.gitversion.outputs.FullSemVer }}

      - name: Publish single-file exe
        run: dotnet publish src/SuperClean.csproj -c Release -r win-x64 -o publish -p:Version=${{ steps.gitversion.outputs.FullSemVer }}

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperClean
          path: publish/SuperClean.exe

      - name: Push to NuGet
        if: github.event_name != 'pull_request' && github.ref_name == 'master'
        run: dotnet nuget push nupkg\*.nupkg --source 'https://api.nuget.org/v3/index.json' -k ${{ secrets.NUGET_API_KEY }} --skip-duplicate

      - name: Create GitHub release
        if: github.event_name != 'pull_request' && github.ref_name == 'master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.gitversion.outputs.MajorMinorPatch }}
          name: v${{ steps.gitversion.outputs.MajorMinorPatch }}
          files: |
            publish/SuperClean.exe
            nupkg/*.nupkg
